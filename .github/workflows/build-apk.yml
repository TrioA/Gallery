name: Build personal APK

on:
    push:
        branches: [main, "feature/**"]
        paths-ignore:
            - "**.md"
    workflow_dispatch:

concurrency:
    group: build-apk-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin
            - uses: gradle/actions/setup-gradle@v4

            - name: Decode signing key
              env:
                  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gallery.jks"
                  echo "SIGNING_STORE_FILE=$RUNNER_TEMP/gallery.jks" >> "$GITHUB_ENV"
                  echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"

            - name: Fetch face models
              run: |
                  mkdir -p app/src/main/assets
                  curl -fL --retry 3 -o app/src/main/assets/blaze_face_short_range.tflite \
                    https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite
                  curl -fL --retry 3 -o app/src/main/assets/auraface_glintr100.tflite \
                    https://huggingface.co/eungsang/auraface-v1-tflite/resolve/ac623dbbf0d4e883203f76a30c365bcc967fed3a/auraface_v1_glintr100_wi8.tflite
                  curl -fL --retry 3 -o app/src/main/assets/blaze_face_full_range.tflite \
                    https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite
                  echo "3698b18f063835bc609069ef052228fbe86d9c9a6dc8dcb7c7c2d69aed2b181b  app/src/main/assets/blaze_face_full_range.tflite" | sha256sum -c -
                  sha256sum app/src/main/assets/*.tflite
                  ls -l app/src/main/assets

            - name: Build emulator (x86_64) APK
              env:
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
              run: |
                  ./gradlew assembleFossDebug --no-daemon -PABI=x86_64 -PVERSION_CODE=$((1000 + ${{ github.run_number }})) -PVERSION_NAME=1.14.2-trio.${{ github.run_number }}
                  mkdir -p emu
                  cp app/build/outputs/apk/foss/debug/*debug.apk emu/
                  rm -f app/build/outputs/apk/foss/debug/*debug.apk

            - name: Build foss debug APK (arm64-v8a, for phones)
              env:
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
              run: ./gradlew assembleFossDebug --no-daemon -PABI=arm64-v8a -PVERSION_CODE=$((1000 + ${{ github.run_number }})) -PVERSION_NAME=1.14.2-trio.${{ github.run_number }}

            - name: Show APK signer
              run: |
                  BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
                  echo "build-tools: $BT"
                  for APK in app/build/outputs/apk/foss/debug/*debug.apk; do
                    echo "== $APK"
                    "$BT"/apksigner verify --verbose --print-certs "$APK" 2>&1 | grep -E "Verifies|v2 scheme|Number of signers|certificate SHA-256" || true
                    "$BT"/aapt2 dump badging "$APK" 2>&1 | grep -E "^package:|native-code" || true
                    ls -l "$APK"
                  done

            - uses: actions/upload-artifact@v4
              with:
                  name: gallery-foss-debug
                  path: app/build/outputs/apk/foss/debug/*debug.apk
                  retention-days: 5

            - uses: actions/upload-artifact@v4
              with:
                  name: gallery-emulator-x86_64
                  path: emu/*debug.apk
                  retention-days: 2

            - name: Remove key
              if: always()
              run: rm -f "$RUNNER_TEMP/gallery.jks"

    emulator-smoke:
        needs: build
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: gallery-emulator-x86_64
                  path: apk
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Fetch public-domain portrait test photos (NASA via Wikimedia Commons)
              run: |
                  mkdir -p faces
                  UA="TrioA-Gallery-CI/1.0 (personal fork test)"
                  curl -fL --retry 3 -A "$UA" -o faces/armstrong_1.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Neil_Armstrong_pose.jpg?width=1200"
                  curl -fL --retry 3 -A "$UA" -o faces/aldrin_1.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Buzz_Aldrin.jpg?width=1200"
                  curl -fL --retry 3 -A "$UA" -o faces/armstrong_3.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Astronaut_Neil_A._Armstrong_(1964).jpg?width=1200" || true
                  curl -fL --retry 3 -A "$UA" -o faces/armstrong_4.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Neil_Armstrong_1958_portrait_cropped.jpg?width=1200" || true
                  python3 -c "from PIL import Image; a=Image.open('faces/armstrong_1.jpg'); a.resize((a.width*2//3,a.height*2//3)).save('faces/armstrong_2.jpg',quality=80)" || cp faces/armstrong_1.jpg faces/armstrong_2.jpg
                  ls -l faces
            - name: Make test photos
              run: python3 .github/scripts/make_photos.py
            - name: Run on emulator and take screenshots
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  target: default
                  profile: pixel_6
                  disable-animations: true
                  ram-size: 4096M
                  heap-size: 576M
                  emulator-boot-timeout: 900
                  script: bash .github/scripts/emulator_shots.sh
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: emulator-screenshots
                  path: shots
                  retention-days: 5

    emulator-focus:
        needs: build
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: gallery-emulator-x86_64
                  path: apk
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Fetch public-domain portraits (NASA via Wikimedia Commons) and compose focus photos
              run: |
                  mkdir -p faces focus
                  UA="TrioA-Gallery-CI/1.0 (personal fork test)"
                  curl -fL --retry 3 -A "$UA" -o faces/armstrong_1.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Neil_Armstrong_pose.jpg?width=1200"
                  curl -fL --retry 3 -A "$UA" -o faces/aldrin_1.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Buzz_Aldrin.jpg?width=1200"
                  curl -fL --retry 3 -A "$UA" -o faces/armstrong_3.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Astronaut_Neil_A._Armstrong_(1964).jpg?width=1200"
                  curl -fL --retry 3 -A "$UA" -o faces/armstrong_4.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Neil_Armstrong_1958_portrait_cropped.jpg?width=1200"
                  pip install --quiet pillow
                  python3 - <<'PY'
                  from PIL import Image
                  a=Image.open('faces/armstrong_1.jpg'); a.resize((a.width*2//3,a.height*2//3)).save('faces/armstrong_2.jpg',quality=80)
                  A=Image.open('faces/armstrong_1.jpg').convert('RGB'); B=Image.open('faces/aldrin_1.jpg').convert('RGB')
                  # head crops (boxes measured offline with the same detector) so both faces are detectable side by side
                  c=Image.new('RGB',(1200,600),(40,40,40))
                  c.paste(A.crop((508,176,1093,761)).resize((600,600)),(0,0)); c.paste(B.crop((431,211,1077,857)).resize((600,600)),(600,0))
                  c.save('focus/multi.jpg',quality=92)
                  h=900; A2=A.resize((int(A.width*h/A.height),h)); B2=B.resize((int(B.width*h/B.height),h))
                  c=Image.new('RGB',(A2.width+B2.width,h),(40,40,40)); c.paste(A2,(0,0)); c.paste(B2,(A2.width,0)); c.save('focus/multi_full.jpg',quality=90)
                  from PIL import ImageEnhance
                  T=Image.open('faces/armstrong_3.jpg').convert('RGB'); T=T.resize((360,int(360*T.height/T.width))); T=ImageEnhance.Brightness(T).enhance(0.15)
                  c=Image.new('RGB',(1600,1200),(70,70,70)); c.paste(T,(800-T.width//2,600-T.height//2)); c.save('focus/tiny.jpg',quality=90)
                  T0=Image.open('faces/armstrong_3.jpg').convert('RGB')
                  T=T0.resize((160,int(160*T0.height/T0.width))); c=Image.new('RGB',(1600,1200),(70,70,70)); c.paste(T,(800-T.width//2,600-T.height//2)); c.save('focus/limit_small.jpg',quality=90)
                  T=T0.resize((360,int(360*T0.height/T0.width))).rotate(90,expand=True,fillcolor=(70,70,70)); c=Image.new('RGB',(1600,1200),(70,70,70)); c.paste(T,(800-T.width//2,600-T.height//2)); c.save('focus/limit_rot90.jpg',quality=90)
                  PY
                  ls -l faces focus
            - name: Focused emulator checks
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  target: default
                  profile: pixel_6
                  disable-animations: true
                  ram-size: 4096M
                  heap-size: 576M
                  emulator-boot-timeout: 900
                  script: bash .github/scripts/emulator_focus.sh
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: focus-results
                  path: shots
                  retention-days: 5

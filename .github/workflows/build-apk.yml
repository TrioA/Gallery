name: Build personal APK

on:
    push:
        branches: [main, "feature/**"]
        paths-ignore:
            - "**.md"
    workflow_dispatch:

concurrency:
    group: build-apk-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin
            - uses: gradle/actions/setup-gradle@v4

            - name: Decode signing key
              env:
                  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gallery.jks"
                  echo "SIGNING_STORE_FILE=$RUNNER_TEMP/gallery.jks" >> "$GITHUB_ENV"
                  echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"

            - name: Fetch face models
              run: |
                  mkdir -p app/src/main/assets
                  curl -fL --retry 3 -o app/src/main/assets/blaze_face_short_range.tflite \
                    https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite
                  curl -fL --retry 3 -o app/src/main/assets/auraface_glintr100.tflite \
                    https://huggingface.co/eungsang/auraface-v1-tflite/resolve/ac623dbbf0d4e883203f76a30c365bcc967fed3a/auraface_v1_glintr100_wi8.tflite
                  sha256sum app/src/main/assets/*.tflite
                  ls -l app/src/main/assets

            - name: Build foss debug APK
              env:
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
                  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
              run: ./gradlew assembleFossDebug --no-daemon -PVERSION_CODE=$((1000 + ${{ github.run_number }})) -PVERSION_NAME=1.14.2-trio.${{ github.run_number }}

            - name: Show APK signer
              run: |
                  APK=$(ls app/build/outputs/apk/foss/debug/*debug.apk | head -1)
                  BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
                  echo "build-tools: $BT"
                  "$BT"/apksigner verify --verbose --print-certs "$APK" 2>&1 | tee apksigner.txt
                  "$BT"/aapt2 dump badging "$APK" 2>&1 | grep -E "^package:|sdkVersion|targetSdk|native-code" | tee badging.txt
                  ls -l "$APK"

            - uses: actions/upload-artifact@v4
              with:
                  name: gallery-foss-debug
                  path: app/build/outputs/apk/foss/debug/*debug.apk
                  retention-days: 5

            - name: Remove key
              if: always()
              run: rm -f "$RUNNER_TEMP/gallery.jks"

    emulator-smoke:
        needs: build
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: gallery-foss-debug
                  path: apk
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Make test photos
              run: python3 .github/scripts/make_photos.py
            - name: Run on emulator and take screenshots
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  target: default
                  profile: pixel_6
                  disable-animations: true
                  ram-size: 4096M
                  heap-size: 576M
                  emulator-boot-timeout: 900
                  script: bash .github/scripts/emulator_shots.sh
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: emulator-screenshots
                  path: shots
                  retention-days: 5
